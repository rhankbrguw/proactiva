services:
  postgres:
    image: postgres:16-alpine
    container_name: proactiva_postgres
    restart: always
    environment:
      POSTGRES_USER: proactiva_user
      POSTGRES_PASSWORD: proactiva_password
      POSTGRES_DB: proactiva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: proactiva_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
